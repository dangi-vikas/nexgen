server:
  port: ${ORDER_SERVICE_PORT:8084}

spring:
  application:
    name: order-service

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${MSSQL_PORT:1433};databaseName=${DB_NAME:orderdb};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        type.preferred_instant_jdbc_type: TIMESTAMP
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    cache:
      type: redis

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Fail fast instead of blocking for a minute when the broker is unreachable,
        # so the outbox can record the failure and retry it.
        max.block.ms: 5000
    consumer:
      group-id: order-service
      auto-offset-reset: latest
      # Events are consumed as raw JSON and parsed into each listener's DTO, so no
      # producer class names travel in the payload or the headers.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

topic:
  order-created: order-created
  order-confirmed: order-confirmed
  order-cancelled: order-cancelled
  order-status-updated: order-status-updated
  inventory-reserved: inventory-reserved
  inventory-rejected: inventory-rejected
  payment-authorized: payment-authorized
  payment-failed: payment-failed
  payment-refunded: payment-refunded

outbox:
  publish:
    delay: 2000
    max-retries: 10
    timeout-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: order-service
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:nexgen-user-service}
  audience: ${JWT_AUDIENCE:nexgen-api}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  services:
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}


logging:
  level:
    root: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
