server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:userdb};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong@Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        type.preferred_instant_jdbc_type: TIMESTAMP
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Fail fast instead of blocking for a minute when the broker is unreachable,
        # so the outbox can record the failure and retry it.
        max.block.ms: 5000

topic:
  user-registration: user-registration
  user-login: user-login
  user-profile-updated: user-profile-updated
  user-password-changed: user-password-changed

outbox:
  publish:
    delay: 2000
    max-retries: 10
    timeout-seconds: 10

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:nexgen-user-service}
  audience: ${JWT_AUDIENCE:nexgen-api}
  # Access tokens are short-lived; refresh tokens are rotated on every use.
  access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}
  refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:604800000}

app:
  cors:
    # Comma-separated allowlist. Never use "*" with credentialed requests.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: user-service
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"