server:
  port: ${PAYMENT_SERVICE_PORT:8085}

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${MSSQL_PORT:1433};databaseName=${DB_NAME:paymentdb};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      group-id: payment-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

topic:
  order-confirmed: order-confirmed
  order-cancelled: order-cancelled
  payment-authorized: payment-authorized
  payment-failed: payment-failed
  payment-refunded: payment-refunded

payments:
  # "simulator" is free and offline. A real PSP (e.g. Stripe test mode, also free)
  # only needs another PaymentGateway implementation and its own webhook.
  gateway: ${PAYMENTS_GATEWAY:simulator}
  currency: ${PAYMENTS_CURRENCY:EUR}

outbox:
  publish:
    delay: 2000
    max-retries: 10
    timeout-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: payment-service
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
