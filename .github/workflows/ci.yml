name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - user-service/user-service
          - product-service/product-service
          - inventory-service/inventory-service
          - cart-service/cart-service
          - order-service/order-service
          - payment-service/payment-service
          - notification-service/notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests
        working-directory: nexgen-server/${{ matrix.module }}
        # The Maven wrapper is committed without the executable bit on some platforms.
        run: |
          chmod +x mvnw
          ./mvnw -B test

  e2e:
    name: end-to-end suite
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Infrastructure, services, gateway and E2E
        # Invoke through bash: the repository is developed on Windows, where
        # core.fileMode=false means a newly added script lands in git as 100644 and
        # `./scripts/ci-e2e.sh` dies with "Permission denied" (exit 126) on the runner.
        run: bash ./scripts/ci-e2e.sh

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: logs/
          retention-days: 7
